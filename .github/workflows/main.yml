
name: VICE_0X Cloud Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  cloud-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Build Docker image
        run: docker build -t vice-0x-shorts-bot:latest .

      - name: Start Docker container
        run: docker run -d --name vice0x-test -p 7860:7860 vice-0x-shorts-bot:latest

      - name: Test application health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7860/health; then
              echo "VICE_0X health check passed"
              exit 0
            fi
            sleep 2
          done

          docker logs vice0x-test
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f vice0x-test || true
        
